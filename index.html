<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veyra</title>
  <meta name="description"
    content="Veyra is a premium, distraction-free digital editorial article reading and publishing experience." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('veyra_theme') || 'paper';
        var root = document.documentElement;
        root.classList.remove('dark', 'theme-paper', 'theme-white', 'theme-studio');
        if (theme === 'dark') {
          root.classList.add('dark');
        } else if (theme === 'white' || theme === 'studio') {
          root.classList.add('theme-studio');
        } else {
          root.classList.add('theme-paper');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
